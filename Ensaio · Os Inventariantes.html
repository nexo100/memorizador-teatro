      }

      // Didascálias de cena antecedentes
      if (speech.directions && speech.directions.length > 0) {
        html += speech.directions.map(d => `<div class="scene-direction">🎭 ${escapeHtml(d)}</div>`).join('');
      }

      if (!isMyTurn) {
        // VISÃO: FALA DO COLEGA
        html += `
          <div class="speech-card">
            <div class="card-meta-row">
              <div class="speaker-meta-left">
                <span class="speaker-name">${escapeHtml(speech.who)}</span>
                ${hasRealAudio ? `<span class="real-audio-badge">🎙️ Áudio Real</span>` : ''}
              </div>
              <span class="mastery-pill">Fala do parceiro</span>
            </div>
            ${intentHtml}
            <div class="speech-content">
              ${speech.segments.map(seg => seg.type === 'rubric' ? ` <span class="rubric">(${escapeHtml(seg.text)})</span> ` : escapeHtml(seg.text)).join('')}
            </div>
            <div class="action-row">
              <button class="btn btn-audio" id="btnSpeakPartner">🔊 Ouvir</button>
              <button class="btn btn-record" id="btnRecordPartner">${hasRealAudio ? '🎙️ Regravar voz real' : '🎙️ Gravar voz real'}</button>
              ${hasRealAudio ? `<button class="btn" style="min-width:44px; padding:0 10px;" id="btnDeleteCastAudio" title="Excluir gravação">🗑️</button>` : ''}
              <button class="btn btn-primary" id="btnContinuePartner">Minha vez ›</button>
            </div>
          </div>
        `;
      } else {
        // VISÃO: MINHA FALA

        // 1. Cartão da Deixa (Cue do parceiro anterior)
        const prevSpeech = speeches[currentIndex - 1];
        let cueHtml = '';
        if (prevSpeech) {
          const hasPrevRealAudio = await getCastAudio(currentIndex - 1);
          if (prevSpeech.who !== selectedActor) {
            // Destaque nas últimas palavras para facilitar o gatilho teatral
            const cueWords = prevSpeech.spokenText.split(' ');
            const cueStart = cueWords.slice(0, Math.max(0, cueWords.length - 4)).join(' ');
            const cueEnd = cueWords.slice(-4).join(' ');

            cueHtml = `
              <div class="cue-card">
                <div class="cue-header">
                  <span class="cue-tag">A Deixa (${escapeHtml(prevSpeech.who)}) ${hasPrevRealAudio ? '🎙️' : ''}</span>
                  <div class="cue-actions">
                    <button class="btn-cue-audio" id="btnSpeakCue">🔊 Ouvir</button>
                    <button class="btn-cue-record" id="btnRecordCue">${hasPrevRealAudio ? '🎙️ Regravar' : '🎙️ Gravar colega'}</button>
                  </div>
                </div>
                <p class="cue-text">“${escapeHtml(cueStart)} <span class="cue-highlight-end">${escapeHtml(cueEnd)}</span>”</p>
              </div>
            `;
          } else {
            cueHtml = `<div class="cue-card"><span class="cue-tag">Continuação</span><p class="cue-text"><i>(continuação da sua fala)</i></p></div>`;
          }
        } else {
          cueHtml = `<div class="cue-card"><span class="cue-tag">Abertura</span><p class="cue-text"><i>(a cena começa com você)</i></p></div>`;
        }
        html += cueHtml;

        // Modo Ping-Pong de Deixas
        if (rehearsalMode === 'pingpong' && !isRevealed) {
          html += `
            <div class="pingpong-timer-box">
              <div class="pingpong-countdown" id="pingPongCountdownNum">${pingPongCountdown}</div>
              <div class="pingpong-label">⚡ Dispare a fala assim que a deixa terminar!</div>
              <button class="btn btn-primary" style="margin-top:8px; min-height:42px; width:100%;" id="btnPingPongDone">⚡ Já falei! Conferir</button>
            </div>
          `;
        }

        // Modo Ponto Eletrônico: Botão de Pausa/Continuar
        if (rehearsalMode === 'ponto') {
          html += `
            <div style="margin-bottom:12px; text-align:center;">
              <button class="btn" style="min-height:38px; font-size:0.85rem;" id="btnTogglePonto">
                ${pontoPaused ? '▶️ Continuar Ponto' : '⏸️ Pausar Ponto'}
              </button>
            </div>
          `;
        }

        // 2. Cartão Principal da Minha Fala
        const levelNames = [
          '1 · Leitura Completa',
          '2 · Poucas Lacunas',
          '3 · Muitas Lacunas',
          '4 · Primeiras Letras',
          '5 · De Memória Total'
        ];

        html += `
          <div class="speech-card">
            <div class="card-meta-row">
              <div class="speaker-meta-left">
                <span class="speaker-name">${escapeHtml(speech.who)}</span>
                ${hasRealAudio ? `<span class="real-audio-badge">🎙️ Minha Gravação</span>` : ''}
              </div>
              <span class="mastery-pill lv${level}">${levelNames[level]}</span>
            </div>
            ${intentHtml}
            <div class="speech-content" id="speechDisplay">
              ${renderSpeechHtml(speech, currentIndex, level, hintsUsedThisLine)}
            </div>
            <div class="action-row">
        `;

        if (level === 0) {
          html += `
            <button class="btn btn-audio" id="btnAudioMy">🔊 Ouvir</button>
            <button class="btn btn-record" id="btnRecordMy">${hasRealAudio ? '🎙️ Regravar voz' : '🎙️ Gravar voz'}</button>
            ${hasRealAudio ? `<button class="btn" style="min-width:40px; padding:0 8px;" id="btnDeleteCastAudio" title="Excluir gravação">🗑️</button>` : ''}
            <button class="btn btn-primary" id="btnHideWords">Já li — Esconder palavras ➔</button>
          `;
        } else if (!isRevealed) {
          html += `
            <button class="btn btn-hint" id="btnHint" title="Revela a próxima palavra oculta (D)">💡 Dica</button>
            <button class="btn btn-audio" id="btnAudioMy">🔊 Ouvir</button>
            <button class="btn btn-record" id="btnRecordMy">${hasRealAudio ? '🎙️ Regravar voz' : '🎙️ Gravar voz'}</button>
            ${hasRealAudio ? `<button class="btn" style="min-width:40px; padding:0 8px;" id="btnDeleteCastAudio" title="Excluir gravação">🗑️</button>` : ''}
            <button class="btn btn-primary" id="btnCheck">👁️ Conferir (Espaço)</button>
          `;
        } else {
          html += `
            <button class="btn btn-danger" id="btnWrong">❌ Errei (1)</button>
            <button class="btn btn-success" id="btnCorrect">✅ Acertei (2)</button>
            <button class="btn btn-audio" id="btnAudioMy">🔊</button>
            <button class="btn btn-record" id="btnRecordMy">${hasRealAudio ? '🎙️ Regravar voz' : '🎙️ Gravar voz'}</button>
            ${hasRealAudio ? `<button class="btn" style="min-width:40px; padding:0 8px;" id="btnDeleteCastAudio" title="Excluir gravação">🗑️</button>` : ''}
          `;
        }

        html += `
            </div>
          </div>
        `;
      }

      $('mainApp').innerHTML = html;
    }

    function renderSceneFinished() {
      $('mainApp').innerHTML = `
        <div class="speech-card" style="text-align:center; padding:36px 20px;">
          <h2 style="font-size:1.4rem; margin-bottom:12px;">🎭 Fim do Bloco / Cena!</h2>
          <p style="color:var(--fg-muted); margin-bottom:24px;">Você percorreu todas as falas selecionadas deste ensaio.</p>
          <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <button class="btn btn-primary" id="btnRestartScene">Recomeçar bloco</button>
            <button class="btn" id="btnReviewWeak">Treinar só fraquezas</button>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       AÇÕES DO ENSAIO
       ========================================================================== */
    function handleActionClick(id) {
      triggerHaptic('tap');
      const currentSpeech = speeches[currentIndex];

      if (id === 'btnEditIntent' || id === 'intentBarCurrent') {
        const cur = getSpeechIntent(currentIndex);
        const promptMsg = `Defina a Ação Dramática / Intenção desta fala (${currentSpeech.who}):\nEx: "Tripudiar sobre a fraqueza do pai", "Desarmar a culpa"\n(Digite "padrao" para restaurar a sugestão original):`;
        const val = prompt(promptMsg, cur);
        if (val !== null) {
          setSpeechIntent(currentIndex, val.trim());
          renderView();
        }
      } else if (id === 'btnSpeakPartner' || id === 'btnAudioMy') {
        playSpeechAudio(currentIndex);
      } else if (id === 'btnSpeakCue') {
        if (currentIndex > 0) playSpeechAudio(currentIndex - 1);
      } else if (id === 'btnRecordPartner') {
        startCastRecording(currentIndex);
      } else if (id === 'btnRecordCue') {
        if (currentIndex > 0) startCastRecording(currentIndex - 1);
      } else if (id === 'btnRecordMy') {
        startCastRecording(currentIndex);
      } else if (id === 'btnPingPongDone') {
        if (pingPongInterval) clearInterval(pingPongInterval);
        pingPongInterval = null;
        isRevealed = true;
        renderView();
      } else if (id === 'btnTogglePonto') {
        pontoPaused = !pontoPaused;
        if (pontoPaused) {
          stopAllAudio();
          showStatus('⏸️ Modo Ponto pausado.');
        } else {
          showStatus('▶️ Retomando Modo Ponto...');
          startPontoFlow();
        }
        renderView();
      } else if (id === 'btnStopRecord') {
        stopCastRecording();
      } else if (id === 'btnDeleteCastAudio') {
        if (confirm('Excluir o áudio gravado desta fala?')) {
          deleteCastAudio(currentIndex).then(() => renderView());
        }
      } else if (id === 'btnContinuePartner') {
        advanceNext();
      } else if (id === 'btnHideWords') {
        masteryLevels[currentIndex] = 1;
        saveProgress();
        renderView();
      } else if (id === 'btnHint') {
        hintsUsedThisLine++;
        renderView();
      } else if (id === 'btnCheck') {
        isRevealed = true;
        renderView();
      } else if (id === 'btnCorrect') {
        triggerHaptic('success');
        const cur = masteryLevels[currentIndex] || 0;
        masteryLevels[currentIndex] = Math.min(4, cur + 1);
        saveProgress();
        advanceNext();
      } else if (id === 'btnWrong') {
        triggerHaptic('error');
        const cur = masteryLevels[currentIndex] || 0;
        masteryLevels[currentIndex] = Math.max(0, cur - 1);
        saveProgress();
        advanceNext();
      } else if (id === 'btnRestartScene') {
        const range = getActiveBeatRange();
        goToSpeech(range.start);
      } else if (id === 'btnReviewWeak') {
        rehearsalMode = 'fraquezas';
        $('selectMode').value = 'fraquezas';
        goToSpeech(pickNextWeakness());
      }
    }

    /* ==========================================================================
       MODAL DE ÍNDICE DE FALAS
       ========================================================================== */
    let currentFilter = 'all';

    async function renderIndexModal() {
      const container = $('indexListContainer');
      const range = getActiveBeatRange();
      let items = [];

      for (let idx = range.start; idx <= range.end; idx++) {
        if (idx < speeches.length) {
          const s = speeches[idx];
          const hasRec = await getCastAudio(idx);
          items.push({ ...s, index: idx, level: masteryLevels[idx] || 0, hasRec });
        }
      }

      if (currentFilter === 'mine') {
        items = items.filter(s => s.who === selectedActor);
      } else if (currentFilter === 'weak') {
        items = items.filter(s => s.who === selectedActor && s.level < 3);
      } else if (currentFilter === 'recorded') {
        items = items.filter(s => s.hasRec);
      }

      if (items.length === 0) {
        container.innerHTML = `<p style="color:var(--fg-muted); text-align:center; padding:20px;">Nenhuma fala encontrada neste filtro.</p>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const isCurrent = item.index === currentIndex;
        const isMine = item.who === selectedActor;
        const badge = isMine ? `<span class="mastery-pill lv${item.level}">Nível ${item.level + 1}</span>` : `<span class="mastery-pill">Colega</span>`;
        return `
          <div class="index-item ${isCurrent ? 'current' : ''}" data-idx="${item.index}">
            <div class="index-item-meta">
              <span class="index-item-who">#${item.index + 1} · ${escapeHtml(item.who)} ${item.hasRec ? '🎙️' : ''}</span>
              ${badge}
            </div>
            <p class="index-item-text">${escapeHtml(item.spokenText || item.segments.map(s => s.text).join(' '))}</p>
          </div>
        `;
      }).join('');
    }

    /* ==========================================================================
       INICIALIZAÇÃO E EVENTOS
       ========================================================================== */
    function initializeApp() {
      const savedScript = localStorage.getItem('memorizador_custom_script');
      const scriptText = savedScript || $('defaultPlay').textContent;
      $('scriptEditor').value = scriptText;

      speeches = parseScriptText(scriptText);
      characters = [...new Set(speeches.map(s => s.who))];

      const savedActor = localStorage.getItem('memorizador_actor');
      selectedActor = (savedActor && characters.includes(savedActor)) ? savedActor : characters[0] || '';

      loadSettings();
      loadProgress();
      populateVoiceSelectors();

      const range = getActiveBeatRange();
      currentIndex = range.start;
      goToSpeech(currentIndex, false);
    }

    // CLIQUES DE INTERFACE
    document.addEventListener('click', (e) => {
      const actorBtn = e.target.closest('[data-actor]');
      if (actorBtn) {
        const actor = actorBtn.dataset.actor;
        if (actor && actor !== selectedActor) {
          selectedActor = actor;
          localStorage.setItem('memorizador_actor', selectedActor);
          loadProgress();
          const first = getMySpeechIndices()[0];
          goToSpeech(first !== undefined ? first : 0);
        }
        return;
      }

      const indexItem = e.target.closest('[data-idx]');
      if (indexItem) {
        const idx = parseInt(indexItem.dataset.idx, 10);
        if (!isNaN(idx)) {
          $('modalIndex').hidden = true;
          goToSpeech(idx);
        }
        return;
      }

      const intentBarEl = e.target.closest('#btnEditIntent, .intent-bar');
      if (intentBarEl) {
        handleActionClick('btnEditIntent');
        return;
      }

      if (e.target.id) {
        handleActionClick(e.target.id);
      }
    });

    // RODAPÉ
    $('btnPrev').onclick = advancePrev;
    $('btnNext').onclick = advanceNext;
    $('btnNavIndex').onclick = () => {
      renderIndexModal();
      $('modalIndex').hidden = false;
    };
    $('btnOpenIndex').onclick = () => {
      renderIndexModal();
      $('modalIndex').hidden = false;
    };
    $('btnCloseIndex').onclick = () => $('modalIndex').hidden = true;

    // FILTRO DE BEATS
    $('selectBeat').onchange = (e) => {
      selectedBeat = e.target.value;
      const range = getActiveBeatRange();
      goToSpeech(range.start);
    };

    // FILTROS DO ÍNDICE
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderIndexModal();
      };
    });

    // MODAL DE CONFIGURAÇÕES
    $('btnOpenSettings').onclick = () => {
      populateVoiceSelectors();
      $('modalSettings').hidden = false;
    };
    $('btnCloseSettings').onclick = () => $('modalSettings').hidden = true;

    $('rangeSpeechRate').oninput = (e) => {
      speechRate = parseFloat(e.target.value);
      $('rateLabel').textContent = speechRate.toFixed(2) + 'x';
      saveSettings();
    };

    $('chkVoice').onchange = (e) => {
      partnerVoiceEnabled = e.target.checked;
      saveSettings();
    };

    $('chkAutoAdvance').onchange = (e) => {
      autoAdvanceEnabled = e.target.checked;
      saveSettings();
    };

    $('chkWakeLock').onchange = (e) => {
      wakeLockEnabled = e.target.checked;
      saveSettings();
      updateWakeLock();
    };

    $('selectMode').onchange = (e) => {
      rehearsalMode = e.target.value;
      saveSettings();
      if (rehearsalMode === 'fraquezas') {
        goToSpeech(pickNextWeakness());
      } else if (rehearsalMode === 'minhas' || rehearsalMode === 'pingpong' || rehearsalMode === 'ponto') {
        const myIndices = getMySpeechIndices();
        if (!myIndices.includes(currentIndex)) {
          goToSpeech(myIndices[0] || 0);
        } else {
          goToSpeech(currentIndex);
        }
      } else {
        renderView();
      }
    };

    $('selectTempo').onchange = (e) => {
      rehearsalTempo = e.target.value;
      saveSettings();
    };

    // VOZES ESPECÍFICAS (NÍVEL A)
    $('voiceSelect_SERGIO').onchange = (e) => {
      localStorage.setItem('voice_actor_SERGIO', e.target.value);
    };
    $('voiceSelect_BARBARA').onchange = (e) => {
      localStorage.setItem('voice_actor_BARBARA', e.target.value);
    };
    $('btnTestVoice_SERGIO').onclick = () => speakSynthesized('Aonde vai com tanta pressa, papai?', 'SÉRGIO');
    $('btnTestVoice_BARBARA').onclick = () => speakSynthesized('Não corra, Juliano. Não corra mais!', 'BÁRBARA');

    $('btnClearAllRecordings').onclick = () => {
      if (confirm('Tem certeza que deseja apagar todos os áudios reais gravados?')) {
        clearAllCastAudios().then(() => {
          alert('Gravações removidas.');
          renderView();
        });
      }
    };

    // BACKUP E RESTAURAÇÃO (SEGURANÇA DE DADOS NO CELULAR)
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function base64ToBlob(base64Data) {
      const parts = base64Data.split(';base64,');
      const contentType = parts[0].split(':')[1];
      const raw = atob(parts[1]);
      const rawLength = raw.length;
      const uInt8Array = new Uint8Array(rawLength);
      for (let i = 0; i < rawLength; ++i) {
        uInt8Array[i] = raw.charCodeAt(i);
      }
      return new Blob([uInt8Array], { type: contentType });
    }

    async function exportFullBackup() {
      try {
        showStatus('Gerando arquivo de backup...');
        const db = await getIndexedDB();
        const recordings = await new Promise((resolve, reject) => {
          const tx = db.transaction('recordings', 'readonly');
          const req = tx.objectStore('recordings').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });

        const serializedRecordings = [];
        for (const rec of recordings) {
          if (rec.blob) {
            const base64 = await blobToBase64(rec.blob);
            serializedRecordings.push({ id: rec.id, base64, mime: rec.blob.type, timestamp: rec.timestamp });
          }
        }

        const backupData = {
          app: 'memorizador-teatro',
          version: 2,
          exportDate: new Date().toISOString(),
          localStorage: {
            memorizador_custom_script: localStorage.getItem('memorizador_custom_script'),
            memorizador_actor: localStorage.getItem('memorizador_actor'),
            memorizador_rate: localStorage.getItem('memorizador_rate'),
            memorizador_tempo: localStorage.getItem('memorizador_tempo'),
            memorizador_voice: localStorage.getItem('memorizador_voice'),
            memorizador_autoadvance: localStorage.getItem('memorizador_autoadvance'),
            memorizador_wakelock: localStorage.getItem('memorizador_wakelock'),
            memorizador_mode: localStorage.getItem('memorizador_mode'),
            voice_actor_SERGIO: localStorage.getItem('voice_actor_SERGIO'),
            voice_actor_BARBARA: localStorage.getItem('voice_actor_BARBARA'),
            memorizador_niveis_SERGIO: localStorage.getItem('memorizador_niveis_SERGIO'),
            memorizador_niveis_BARBARA: localStorage.getItem('memorizador_niveis_BARBARA'),
          },
          recordings: serializedRecordings
        };

        // Exporta dinamicamente todas as intenções dramáticas salvas (intent_*)
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('intent_')) {
            backupData.localStorage[k] = localStorage.getItem(k);
          }
        }

        const jsonStr = JSON.stringify(backupData);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-ensaio-teatro-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showStatus('Backup baixado com sucesso!');
      } catch (err) {
        alert('Erro ao exportar backup: ' + err.message);
      }
    }

    async function importFullBackup(file) {
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.localStorage || !Array.isArray(data.recordings)) {
          throw new Error('Arquivo de backup inválido.');
        }

        Object.keys(data.localStorage).forEach(key => {
          const val = data.localStorage[key];
          if (val !== null && val !== undefined) {
            localStorage.setItem(key, val);
          }
        });

        const db = await getIndexedDB();
        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');
        await store.clear();

        for (const rec of data.recordings) {
          if (rec.base64) {
            const blob = base64ToBlob(rec.base64);
            store.put({ id: rec.id, blob, timestamp: rec.timestamp || Date.now() });
          }
        }

        tx.oncomplete = () => {
          alert('Backup restaurado com sucesso! Seus dados e áudios foram recuperados.');
          initializeApp();
          $('modalSettings').hidden = true;
        };
      } catch (err) {
        alert('Erro ao restaurar backup: ' + err.message);
      }
    }

    $('btnExportBackup').onclick = exportFullBackup;
    $('fileImportBackup').onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        importFullBackup(e.target.files[0]);
      }
    };

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }

    $('btnResetProgress').onclick = () => {
      if (confirm(`Zerar todo o histórico de memorização para ${selectedActor}?`)) {
        masteryLevels = speeches.map(() => 0);
        saveProgress();
        renderView();
        $('modalSettings').hidden = true;
      }
    };

    $('btnSaveScript').onclick = () => {
      const text = $('scriptEditor').value.trim();
      if (!text) return;
      localStorage.setItem('memorizador_custom_script', text);
      $('modalSettings').hidden = true;
      initializeApp();
    };

    $('btnRestoreOriginal').onclick = () => {
      if (confirm('Restaurar o texto original de "Os Inventariantes"?')) {
        localStorage.removeItem('memorizador_custom_script');
        $('modalSettings').hidden = true;
        initializeApp();
      }
    };

    // ATALHOS DE TECLADO (DESKTOP)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

      if (e.key === 'Escape') {
        $('modalIndex').hidden = true;
        $('modalSettings').hidden = true;
        return;
      }

      if (e.key === 'i' || e.key === 'I') {
        e.preventDefault();
        const m = $('modalIndex');
        m.hidden = !m.hidden;
        if (!m.hidden) renderIndexModal();
        return;
      }

      const currentSpeech = speeches[currentIndex];
      const isMyTurn = currentSpeech && currentSpeech.who === selectedActor;
      const level = masteryLevels[currentIndex] || 0;

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        advanceNext();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        advancePrev();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (!isMyTurn) advanceNext();
        else if (level === 0) handleActionClick('btnHideWords');
        else if (!isRevealed) handleActionClick('btnCheck');
        else handleActionClick('btnCorrect');
      } else if (e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        if (isMyTurn && !isRevealed && level > 0) handleActionClick('btnHint');
      } else if (e.key === '1') {
        e.preventDefault();
        if (isMyTurn && isRevealed) handleActionClick('btnWrong');
      } else if (e.key === '2') {
        e.preventDefault();
        if (isMyTurn && isRevealed) handleActionClick('btnCorrect');
      } else if (e.key === 'r' || e.key === 'R' || e.key === 'o' || e.key === 'O') {
        e.preventDefault();
        if (currentSpeech) playSpeechAudio(currentIndex);
      }
    });

    initializeApp();
  </script>
</body>
</html>
