<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8e2a2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ensaio">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>🎭 Ensaio Teatral · Os Inventariantes</title>
  <style>
    :root {
      --bg: #f8f5f0;
      --card-bg: #ffffff;
      --fg: #1d1b18;
      --fg-muted: #6e675d;
      --border: #dfd7cb;
      --border-subtle: #eee7dc;
      --accent: #8e2a2a;
      --accent-hover: #752020;
      --accent-soft: rgba(142, 42, 42, 0.08);
      --accent-text: #ffffff;
      --success: #2e7d32;
      --success-soft: rgba(46, 125, 50, 0.12);
      --danger: #c62828;
      --danger-soft: rgba(198, 40, 40, 0.12);
      --hint-bg: #fff8e1;
      --hint-border: #ffd54f;
      --hint-fg: #8d6e15;
      --recording: #e53935;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.07);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141311;
        --card-bg: #1e1b17;
        --fg: #ede7dc;
        --fg-muted: #9c9486;
        --border: #353028;
        --border-subtle: #25221c;
        --accent: #e06e5e;
        --accent-hover: #ea8172;
        --accent-soft: rgba(224, 110, 94, 0.14);
        --accent-text: #141311;
        --success: #66bb6a;
        --success-soft: rgba(102, 187, 106, 0.15);
        --danger: #ef5350;
        --danger-soft: rgba(239, 83, 80, 0.15);
        --hint-bg: #2b2513;
        --hint-border: #795d13;
        --hint-fg: #ffe082;
        --recording: #ef5350;
        --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #141311;
      --card-bg: #1e1b17;
      --fg: #ede7dc;
      --fg-muted: #9c9486;
      --border: #353028;
      --border-subtle: #25221c;
      --accent: #e06e5e;
      --accent-hover: #ea8172;
      --accent-soft: rgba(224, 110, 94, 0.14);
      --accent-text: #141311;
      --success: #66bb6a;
      --success-soft: rgba(102, 187, 106, 0.15);
      --danger: #ef5350;
      --danger-soft: rgba(239, 83, 80, 0.15);
      --hint-bg: #2b2513;
      --hint-border: #795d13;
      --hint-fg: #ffe082;
      --recording: #ef5350;
    }

    *, *:before, *:after { box-sizing: inherit; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select, textarea {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 12px 16px 120px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .app-header {
      margin-bottom: 12px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .play-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn-header:hover {
      background: var(--border-subtle);
      border-color: var(--fg-muted);
    }

    /* TABS DE PERSONAGEM */
    .character-tabs {
      display: flex;
      gap: 8px;
      margin: 8px 0;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .character-tabs::-webkit-scrollbar { display: none; }

    .char-tab {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.18s ease;
      touch-action: manipulation;
    }
    .char-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      box-shadow: var(--shadow-sm);
    }
    .char-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(0,0,0,0.07);
    }
    .char-tab.active .char-badge {
      background: rgba(255,255,255,0.22);
    }

    /* PROGRESS BAR */
    .progress-section {
      margin: 8px 0 10px;
    }
    .progress-bar-bg {
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--fg-muted);
      margin-top: 5px;
      font-family: system-ui, sans-serif;
    }

    /* FILTRO DE BEATS DRAMÁTICOS */
    .beat-selector-bar {
      margin-bottom: 8px;
    }
    .beat-select {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--fg);
      cursor: pointer;
    }

    /* TOOLBAR ROW */
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }
    .mode-select {
      background: transparent;
      border: none;
      color: var(--fg);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .mode-select:focus {
      outline: 2px solid var(--accent);
    }
    .toolbar-toggles {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .toggle-chip {
      font-size: 0.82rem;
      color: var(--fg-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      user-select: none;
    }
    .toggle-chip input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* STATUS DE VOZ E TOAST */
    .status-toast {
      font-size: 0.8rem;
      color: var(--fg-muted);
      font-family: system-ui, sans-serif;
      margin-bottom: 6px;
      min-height: 1.2em;
    }

    /* ÁREA DO ENSAIO */
    .rehearsal-card-container {
      flex: 1;
    }

    /* DIDASCÁLIA / AÇÃO DE CENA */
    .scene-direction {
      font-style: italic;
      color: var(--fg-muted);
      font-size: 0.92rem;
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    /* BARRA DE AÇÃO / INTENÇÃO DRAMÁTICA (STANISLAVSKI) */
    .intent-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 12px;
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
    }
    .intent-label {
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .intent-text {
      color: var(--fg);
      font-style: italic;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-intent-edit {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 2px 7px;
      color: var(--fg-muted);
      transition: all 0.15s;
    }
    .btn-intent-edit:hover {
      color: var(--fg);
      border-color: var(--fg);
    }

    /* CARTÃO DA DEIXA (CUE) */
    .cue-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .cue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cue-tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--accent);
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cue-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-cue-audio {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.75rem;
      padding: 3px 8px;
      cursor: pointer;
      color: var(--fg);
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-cue-audio:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-cue-record {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.75rem;
      padding: 3px 8px;
      cursor: pointer;
      color: var(--recording);
      font-weight: 600;
      transition: all 0.15s;
    }
    .cue-text {
      font-size: 1.05rem;
      color: var(--fg-muted);
      font-style: italic;
      line-height: 1.45;
      margin: 0;
    }
    .cue-highlight-end {
      color: var(--fg);
      font-weight: 600;
      font-style: normal;
    }

    /* CARTÃO DA FALA PRINCIPAL */
    .speech-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .speaker-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .speaker-name {
      font-family: system-ui, sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg);
    }
    .real-audio-badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(229, 57, 53, 0.12);
      color: var(--recording);
      font-weight: 700;
      font-family: system-ui, sans-serif;
    }
    .mastery-pill {
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--border-subtle);
      color: var(--fg-muted);
    }
    .mastery-pill.lv0 { background: rgba(198, 40, 40, 0.1); color: var(--danger); }
    .mastery-pill.lv1, .mastery-pill.lv2 { background: rgba(230, 150, 0, 0.15); color: #b7791f; }
    .mastery-pill.lv3, .mastery-pill.lv4 { background: var(--success-soft); color: var(--success); }

    /* TEXTO DA FALA */
    .speech-content {
      font-size: 1.25rem;
      line-height: 1.6;
      margin: 14px 0 20px;
      word-break: break-word;
    }
    .speech-content .rubric {
      font-family: system-ui, sans-serif;
      font-style: italic;
      color: var(--fg-muted);
      font-size: 0.95rem;
      display: inline;
      padding: 0 3px;
    }
    .masked-word {
      letter-spacing: 0.12em;
      color: var(--fg-muted);
      font-weight: 600;
      background: var(--border-subtle);
      padding: 0 4px;
      border-radius: 4px;
    }
    .first-letter-word {
      color: var(--fg);
      font-weight: 700;
      background: var(--border-subtle);
      padding: 0 3px;
      border-radius: 3px;
    }
    .first-letter-word .dots {
      color: var(--fg-muted);
      letter-spacing: 0.08em;
      font-weight: normal;
    }
    .hint-revealed {
      background: var(--hint-bg);
      border-bottom: 2px solid var(--hint-border);
      color: var(--hint-fg);
      font-weight: 700;
      padding: 0 4px;
      border-radius: 3px;
    }
    .full-memory-placeholder {
      display: inline-block;
      font-style: italic;
      color: var(--fg-muted);
      font-size: 1rem;
      padding: 12px;
      background: var(--border-subtle);
      border-radius: 8px;
      width: 100%;
      text-align: center;
    }

    /* MODO PING-PONG / TIMER */
    .pingpong-timer-box {
      margin-bottom: 14px;
      text-align: center;
      padding: 12px;
      background: var(--accent-soft);
      border-radius: 10px;
      border: 1px solid var(--accent);
    }
    .pingpong-countdown {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      font-family: system-ui, sans-serif;
      line-height: 1;
    }
    .pingpong-label {
      font-size: 0.82rem;
      color: var(--fg-muted);
      margin-top: 4px;
    }

    /* BARRA DE GRAVAÇÃO ATIVA */
    .recording-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(229, 57, 53, 0.12);
      border: 1px solid var(--recording);
      border-radius: 8px;
      margin-bottom: 12px;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--recording);
      font-weight: 700;
    }
    .recording-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--recording);
      animation: pulse 1s infinite;
      margin-right: 6px;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* BOTÕES DE AÇÃO */
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 14px;
    }

    .btn {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--fg);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      flex: 1;
      min-width: 140px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
      flex: 1;
    }
    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      flex: 1;
    }
    .btn-hint {
      background: var(--hint-bg);
      border-color: var(--hint-border);
      color: var(--hint-fg);
    }
    .btn-record {
      border-color: var(--recording);
      color: var(--recording);
    }

    /* FOOTER FIXO / NAVEGAÇÃO */
    .app-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .footer-inner {
      max-width: 680px;
      margin: 0 auto;
    }
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .btn-nav {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .btn-nav-center {
      background: transparent;
      border: none;
      color: var(--fg);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
    }
    .keyboard-guide {
      font-size: 0.72rem;
      color: var(--fg-muted);
      text-align: center;
      margin-top: 4px;
      font-family: system-ui, sans-serif;
    }
    kbd {
      background: var(--border-subtle);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 4px;
      font-family: inherit;
    }

    /* MODAIS */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop[hidden] {
      display: none !important;
    }
    .modal-content {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      font-size: 1.15rem;
      margin: 0;
    }
    .btn-close {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--fg-muted);
      padding: 0 6px;
      line-height: 1;
    }
    .modal-filter-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--card-bg);
      overflow-x: auto;
    }
    .filter-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }

    /* LISTA DO ÍNDICE */
    .index-item {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s;
    }
    .index-item:hover {
      border-color: var(--accent);
    }
    .index-item.current {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .index-item-meta {
      display: flex;
      justify-content: space-between;

  <script type="text/plain" id="defaultPlay">**OS**** INVENTARIANTES**

**Texto Teatral de Walter Paiva (Adaptação Dramatúrgica Depurada e Lapidada)**

**Personagens:**

- **Juliano:** Um ancião mefítico (65 a 70 anos aproximadamente).

- **Bárbara:** Mulher de Juliano (60 a 65 anos aproximadamente).

- **Sérgio:** Filho de Juliano e Bárbara (35 anos aproximadamente).

**Cenário:**

Sala da casa de Sérgio. A linguagem cenográfica da peça deve traduzir uma atmosfera lúdica de sombria degradação.

*(Entra Juliano, um ancião mefítico pelas moléstias que o torturam com requintes de crueldade, movendo-se desesperadamente e com intensa fragilidade. Impossibilitado de falar, seus olhos turvos clamam por socorro. Em sua perseguição, entram Sérgio e Bárbara, cada qual com sua peculiar caracterização ameaçadora. Sérgio exala a agressividade irônica e cansada de quem definhou naquele ambiente; Bárbara traz uma rigidez contida, arrastando uma dor antiga. Sérgio delicia-se com a vulnerabilidade e o desespero do pai.)*

**SÉRGIO:** *(Sarcástico.)* Aonde vai com tanta pressa, papai?

**BÁRBARA:** Não corra, Juliano. Não corra mais!

**SÉRGIO:** Está desperdiçando seu tão precioso fôlego!

**BÁRBARA:** *(Tentando abraçá-lo com condescendência distante.)* Venha cá! *(Juliano tenta escapar das duas criaturas. Após correr muito, imobiliza-se. Está alucinado de dor. Fixa o olhar na plateia com grande dificuldade. Busca o olhar de Bárbara, mas ela desvia o rosto.)* O que está vendo, querido?

**SÉRGIO:** *(Dando uma gargalhada.)* Encontrou uma luz no fim do túnel? *(Aproxima-se.)* Aposto que é a morte vindo em sua direção... *(Juliano clama por todas as suas forças para fugir, mas não consegue mover um músculo sequer. Suas energias estão esgotadas. Fatalmente, só consegue suspirar.)*

**BÁRBARA:** *(Ajeita a cabeça de Juliano com frieza mecânica.)* Eu sabia que você não ia conseguir, Juliano. Sinto muito. *(Acomodando-o.)* Sente-se aqui e descanse.

**SÉRGIO:** *(Amarrando-o com ataduras usadas e sujas.)* Fique tranquilo. Isto é só para termos certeza de que você não fugirá de novo, seu cagão!

**BÁRBARA:** *(Censurando-o com voz seca.)* Sérgio!

**SÉRGIO:** *(Irônico.)* O que foi?

**BÁRBARA:** Você fala demais!

**SÉRGIO:** Como devo me dirigir a esta... assombração?

**BÁRBARA:** *(Chegando às lágrimas.)* Pare, Sérgio!

**SÉRGIO:** *(Abraçando-a.)* Ei, o que há? Nada disso, nada de lamentos. Já é tarde e todos têm seus objetivos nesta vida, *(Encara Juliano.)* por mais insanos que possam parecer a certos demônios... *(Voltando-se a Bárbara.)* E estamos aqui dispostos a cumprir a nossa missão "divina". Esqueceu, mamãe?

**BÁRBARA:** *(Encarando-o.)* Sérgio...

**SÉRGIO:** *(Acentuando a eloquência.)* Seja forte, dona Bárbara! Não deixe a emoção dissimular sua consciência. Pelo menos uma vez na vida, encare a realidade de frente!

**BÁRBARA:** *(Breve pausa. Vagarosamente, desenrola de um lenço um revólver. Fixa seu olhar em Juliano. Dirige-se a ele sendo seguida por Sérgio.)* Vamos acabar logo com isso. *(Sérgio aplaude. Juliano, atônito, procura livrar-se das amarras, mas não consegue.)*

**SÉRGIO:** Seja um bom menino e comporte-se!

**BÁRBARA:** *(Sentando-se ao lado de Juliano.)* Juliano, você está horrível. Seu aspecto é repugnante e nojento, o cheiro de sua pele chega a dar náuseas e você se sangra todo ao urinar.

**SÉRGIO:** *(Agarrando-o violentamente pelos testículos.)* Isto aqui fede, sangra e faz a gente vomitar! Está entendendo? *(Juliano solta um gemido abafado, quase desfalecendo.)* Que que há? Já cagou de novo? *(Examina-o. Grita.)* De novo? Sabe há quantos anos a gente aguenta isso? Alguma vez na vida você já limpou as suas cagadas? Responda!

**BÁRBARA:** *(Suspira.)* Não sabemos mais como cuidar de você, Juliano. Você não come mais nada. Não é mesmo, Sérgio? *(Sérgio continua examinando-o com desdém.)* Tudo lhe faz mal, Juliano. Também não sabemos quando descansa, pois você dorme com os olhos abertos! *(Amargurada.)* Estou assustada, Juliano. Não suporto mais!

**SÉRGIO:** *(Sorridente, pega a arma de Bárbara.)* Mas, veja só! Conseguimos, enfim, encontrar uma solução para esta tortura, um modo plenamente justo de realizar este ato de misericórdia familiar. *(Fitando-o nos olhos.)* Chame de eutanásia, se quiser.

**BÁRBARA:** Desejamos que tudo termine bem, Juliano. Sem dor, sem sofrimento...

**SÉRGIO:** Sem culpa, também!

**BÁRBARA:** Sim, é isto. Suplicamos que o destino decida tudo — somente ele.

**SÉRGIO:** *(Prepara o revólver entusiasticamente.)* Pronto: a “roleta russa” pode começar. O revólver é passado a cada jogador, que deverá acionar o gatilho contra a própria cabeça. Se a câmara estiver vazia e ressoar apenas um “clic”, muito bem: é um ponto. Do contrário, é o perdedor... *(Sorrindo.)* para sempre! *(Aponta a arma contra a própria têmpora.)* Posso começar? *(Momento de hesitação. O clima é tenso. Aciona o gatilho. Disparo 1 — Sérgio: apenas um "clic". Alívio sutil na cena. A arma é passada para Bárbara.)*

**BÁRBARA:** *(Colocando-se em pé.)* Sabe, Juliano. A proposta foi de Sérgio, mas eu gostei muito da ideia. Dessa forma não há injustiça, não há erro. Ninguém aqui está assassinando ninguém. Eu preciso acreditar que o destino de cada um aqui será o mesmo de antes, entende? Só estamos dando um jeito de apressar as coisas... *(Engatilha o revólver.)* Eu pensei que iria sofrer neste momento, Juliano. Mas, pelo contrário, estou sentindo uma sensação boa, muito boa. Uma sensação de alívio... *(Suspira.)* Sinto que talvez eu possa descansar, enfim. *(Virando-se para Sérgio, que lhe estende um sorriso.)* A propósito, Juliano, é preciso que saiba que, se você for o perdedor, um novo mundo será tomado em nossas vidas. *(Encarando-o.)* Mas, se um de nós deixar de viver, o outro continuará cuidando de você – amargurado ou não. *(Encostando a arma no crânio e fechando os olhos.)* Que tudo siga o seu caminho... *(Aciona o gatilho. Disparo 2 — Bárbara: apenas um “clic”. Chora em silêncio.)*

**SÉRGIO:** *(Toma a arma com ímpeto, encarando Juliano, que se contorce em pavor.)* Muito bem, meu pai: chegou a sua vez de jogar! Está ansioso, não? Dá para perceber. *(Forte.)* Eu queria ter um espelho aqui para você ver a sua fuça roxa de pavor!

**BÁRBARA:** Sérgio!

**SÉRGIO:** *(Extremamente irônico. Juliano tenta mover a cabeça.)* Oh, queira desculpar-me. Havia me esquecido que, além de mudo, você está quase completamente cego, também. É uma pena que talvez não consiga mesmo se ver assim: tão ativo, disposto, cheio de energia — até tentando lutar como um homem de verdade. *(Acentuando a eloquência.)* Só que é tarde demais para você buscar um ideal. *(Engatilha a arma. Aponta a arma para Juliano, que permanece inerte, incapaz de segurar o objeto.)* Mesmo que seja o ideal de viver! *(Constatando a incapacidade do pai, Sérgio encosta a arma na própria cabeça.)* Como você nunca consegue fazer nada... eu jogo por você! *(Aciona o gatilho. Disparo 3 — Sérgio joga por Juliano: câmara vazia. Permanece em silêncio por um segundo. Encarando a nuca de Juliano.)* Por que você voltou?

**BÁRBARA:** *(Em tom baixo.)* Ele não tinha para onde ir.

**SÉRGIO:** *(Rindo sem humor, numa respiração curta.)* Não tinha... Pai pródigo. Sumiu quando eu era um garoto e voltou dez anos atrás arrebentado, arrastando esse bagaço pra cá. *(Pausa.)* Dez anos. Limpando fralda. Lavando pus. Larguei o curso... larguei o trabalho... larguei tudo. Eu fiquei nesta casa por você, mãe.

*(Silêncio denso. Bárbara desvia o olhar lentamente, incapaz de olhar para Sérgio.)*

**SÉRGIO:** *(Voz baixa.)* Quando ele ainda tinha braço pra rachar a sua cara... eu entrava na frente. E quando ele voltou caindo aos pedaços... você nem precisou pedir. Eu vi nos seus olhos. Como é que eu ia embora?

**BÁRBARA:** *(Com voz rasgada.)* Eu devia ter mandado você ir.

**SÉRGIO:** *(Seco.)* Você nunca mandou.

**BÁRBARA:** *(Pausa longa. Olha para a parede desbotada.)* Eu sei. Eu tinha pavor de ficar sozinha com os restos dele. *(Passa a mão pelo próprio braço.)* Eu vi a sua vida parar aqui do meu lado, Sérgio... e eu me calei.

*(Sérgio engole em seco. Limpa o rosto com brutalidade. Respira fundo, força um sorriso largo e assume novamente uma postura empertigada, usando a teatralidade como escudo.)*

**SÉRGIO:** *(Com ironia grandiloquente.)* Mas passaram-se os anos, dona Bárbara... e é muito bom saber que, dentro de alguns instantes, eu poderei começar tudo de novo! Embora eu já esteja com esta idade e tão atormentado por tudo isso, pode acreditar que estou com mais garra do que nunca! Fatalmente, irei reconquistar o meu espaço neste mundo tão grande e maravilhoso! *(Olhando para o revólver.)* Ou, se o jogo do destino preferir assim, irei brilhar em outra dimensão. Lá no alto, com certeza, entre os mais lindos deuses do Olimpo! *(Dá uma risada histriônica. Encosta a arma na própria têmpora.)* Você admira esta minha força, não é mesmo, pai? Confesse! Eu sei o porquê: eu simplesmente represento toda aquela determinação que você sempre quis possuir um dia na vida e nunca conseguiu. Sempre evitou, fugiu ou fracassou! *(Segura o queixo de Juliano, direcionando o rosto do pai para si, embora saiba da visão quase nula dele.)* Olhe para mim, "papai"! Veja o meu sorriso, sinta o brilho dos meus olhos: eu quero que você olhe para mim! *(Sérgio aciona o gatilho. Disparo 4 — Sérgio: câmara vazia. Pausa. Sérgio sorri.)* Ainda está vivo? Até que suas pontes de safena estão mais sólidas do que eu pensava... *(Oferece o revólver a Bárbara. Bárbara recua dois passos, encarando a arma com pavor.)*

**BÁRBARA:** *(Grito contido.)* Chega!

**SÉRGIO:** *(Estranhando.)* O que houve?

**BÁRBARA:** Pare, Sérgio. Por favor, pare!

**SÉRGIO:** *(Segurando o revólver. Balança a cabeça negativamente.)* Não, minha mãe!

**BÁRBARA:** Sérgio! Pense bem no que estamos fazendo. Não tem sentido!

**SÉRGIO:** É claro que tem!

**BÁRBARA:** Sinto que vou morrer!

**SÉRGIO:** *(Num tom baixo, definitivo.)* Talvez, mãe!

**BÁRBARA:** Sérgio. Ouça-me!

**SÉRGIO:** É a sua vez de jogar, dona Bárbara. *(Grita.)* Jogue agora!

**BÁRBARA:** *(Súplice.)* Não...

**SÉRGIO:** *(Voz embargada.)* Pois, então, eu jogo por você!

**BÁRBARA:** *(Sobressalto.)* Não! *(Sérgio encosta a arma na própria cabeça e dispara. Disparo 5 — Sérgio joga por Bárbara: câmara vazia. O estalo seco ecoa. Bárbara e Sérgio se agarram num abraço tenso e exausto. Juliano move os lábios sem emitir som, tremendo na cadeira. Sérgio e Bárbara soltam-se lentamente e olham para Juliano com um sorriso estático. Dirigem-se a ele.)*

**SÉRGIO:** *(Numa melodia sarcástica.)* Olá, perdedor! Este é o disparo número seis!

**BÁRBARA:** *(Carinhosa.)* Descanse em paz, querido. Seja feliz.

**SÉRGIO:** *(Radiante.)* Bem feliz!

**BÁRBARA:** *(Ajeita o colarinho sujo de Juliano com cuidado automático. Beija-lhe a testa.)* Fique tranquilo. Não vai doer nada!

**SÉRGIO:** *(Tira um lenço do bolso, limpa delicadamente uma nesga de saliva no canto da boca de Juliano.)* Sabe por que você tem medo da morte? Porque você nunca teve coragem de viver!

**BÁRBARA:** Lembre-se agora dos bons momentos, querido.

**SÉRGIO:** Viva este momento como nunca!

**BÁRBARA:** Adeus... *(Sérgio engatilha o revólver e o encosta na têmpora de Juliano. Blecaute imediato. Ouve-se o disparo seco. Foco de luz em resistência sobre Juliano morto na cadeira de rodas. A cadeira gira lentamente e a iluminação vai se esvaziando até a escuridão total.)*

**SÉRGIO:** *(Em off. Num sussurro comedido.)* Perdão, pai!

**FIM**</script>

      },

      // Palavras Funcionais / Conectivos em Português (Linguística Cognitiva)
      FUNCTION_WORDS: new Set([

    // 2. UTILITÁRIOS (Utils)
    const Utils = {
      $(id) {
        return document.getElementById(id);
      },
      escapeHtml(str) {
        return (str || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      },
      sanitizeId(str) {
        return (str || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '_');
      },
      isFunctionWord(word) {
        const clean = (word || '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
        return AppConfig.FUNCTION_WORDS.has(clean);
      },
      hashCoord(i, j) {
        let x = (i * 73856093) ^ (j * 19349663);
        x = Math.imul(x ^ (x >>> 13), 1274126177);
        return Math.abs(x ^ (x >>> 16)) % 100;
      },
      maskWord(word, mode) {
        if (!word) return '';
        const regex = /([\p{L}\p{N}]+)/gu;
        const parts = word.split(regex);
        return parts.map(part => {
          if (!part) return '';
          if (/^[\p{L}\p{N}]+$/u.test(part)) {
            const escaped = Utils.escapeHtml(part);
            if (mode === 'initial') {
              const first = escaped[0];
              const restDots = '.'.repeat(Math.max(1, Math.min(3, escaped.length - 1)));
              return `<span class="first-letter-word">${first}<span class="dots">${restDots}</span></span>`;
            } else {
              const blank = '_'.repeat(Math.max(2, escaped.length));
              return `<span class="masked-word">${blank}</span>`;
            }
          }
          return Utils.escapeHtml(part);
        }).join('');
      },
      triggerHaptic(type = 'tap') {
        try {
          if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
            if (type === 'tap') navigator.vibrate(25);
            else if (type === 'success') navigator.vibrate([20, 30, 20]);
            else if (type === 'error') navigator.vibrate([40, 50, 40]);
          }
        } catch (e) {}
      },
      blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      },
      base64ToBlob(base64Data, defaultType = 'audio/webm') {
        let contentType = defaultType;
        let base64 = base64Data;
        if (base64Data.includes(';base64,')) {
          const parts = base64Data.split(';base64,');
          contentType = (parts[0].split(':')[1]) || defaultType;
          base64 = parts[1];
        }
        const raw = atob(base64);
        const rawLength = raw.length;
        const uInt8Array = new Uint8Array(rawLength);
        for (let i = 0; i < rawLength; ++i) {
          uInt8Array[i] = raw.charCodeAt(i);
        }
        return new Blob([uInt8Array], { type: contentType });
      }
    };

    // 3. ESTADO DA SESSÃO (AppState)
    const AppState = {
      speeches: [],
      characters: [],
      selectedActor: '',
      currentIndex: 0,
      activeBeats: [],
      selectedBeat: 'all',
      rehearsalMode: 'cena',
      rehearsalTempo: 'normal',
      masteryLevels: [],
      isRevealed: false,
      hintsUsedThisLine: 0,
      partnerVoiceEnabled: true,
      autoAdvanceEnabled: false,
      wakeLockEnabled: true,
      speechRate: 0.95,
      activeScriptText: '',
      currentFilter: 'all',

      // Timers & controle de fluxo
      pingPongCountdown: 4,
      pingPongInterval: null,
      pontoPaused: false,
      wakeLock: null,

      getPlayId() {
        if (ScriptParser.isDefaultPlay(this.activeScriptText)) {
          return 'default';
        }
        const title = ScriptParser.extractPlayTitle(this.activeScriptText);
        return 'play_' + Utils.sanitizeId(title || 'custom');
      },

      getActiveBeatRange() {
        if (this.selectedBeat === 'all') {
          return { start: 0, end: Math.max(0, this.speeches.length - 1) };
        }
        const b = this.activeBeats[parseInt(this.selectedBeat, 10)];
        return b ? { start: b.start, end: Math.min(this.speeches.length - 1, b.end) } : { start: 0, end: Math.max(0, this.speeches.length - 1) };
      },

      getFilteredSpeechIndices() {
        const range = this.getActiveBeatRange();
        const list = [];
        for (let i = range.start; i <= range.end; i++) {
          if (i < this.speeches.length) list.push(i);
        }
        return list;
      },

      getMySpeechIndices() {
        const filtered = this.getFilteredSpeechIndices();
        return filtered.filter(i => this.speeches[i].who === this.selectedActor);
      },

      pickNextWeakness() {
        const myIndices = this.getMySpeechIndices();
        if (myIndices.length === 0) return 0;
        if (myIndices.length === 1) return myIndices[0];

        const candidates = myIndices.filter(i => i !== this.currentIndex);
        const listToUse = candidates.length > 0 ? candidates : myIndices;

        const weights = listToUse.map(i => Math.pow(Math.max(0.2, 5 - (this.masteryLevels[i] || 0)), 2));
        const totalWeight = weights.reduce((a, b) => a + b, 0);

        let random = Math.random() * totalWeight;
        for (let k = 0; k < listToUse.length; k++) {
          random -= weights[k];
          if (random <= 0) {
            return listToUse[k];
          }
        }
        return listToUse[listToUse.length - 1];
      }
    };

    // 4. PARSER E MODELO DRAMATÚRGICO (ScriptParser & DramaBeats)
    const ScriptParser = {
      isMetaKeyword(str) {
        const s = (str || '').replace(/\*+/g, '').trim().toLowerCase();
        return (
          s === 'personagens' || s === 'personagem' || s === 'elenco' ||
          s === 'dramatis personae' ||
          s === 'cenário' || s === 'cenario' ||
          s === 'texto' || s === 'texto teatral' || s === 'fim' ||
          s === 'prólogo' || s === 'prologo' ||
          s === 'epílogo' || s === 'epilogo' ||
          s.startsWith('texto ') ||
          s.startsWith('ato ') ||
          s.startsWith('cena ') ||
          /^ato\s+[0-9ivxlcdm]+/i.test(s) ||
          /^cena\s+[0-9ivxlcdm]+/i.test(s)
        );
      },

      isDefaultPlay(rawText) {
        return (rawText || '').includes('OS INVENTARIANTES') || (rawText || '').includes('Walter Paiva');
      },

      extractPlayTitle(rawText) {
        const lines = (rawText || '').split(/\r?\n/).slice(0, 15);
        for (const l of lines) {
          const trimmed = l.trim();
          if (!trimmed) continue;
          if (trimmed.toLowerCase().includes('inventariantes')) {
            return 'Os Inventariantes';
          }
          const hashMatch = trimmed.match(/^#+\s*(.+)$/);
          if (hashMatch) return hashMatch[1].replace(/\*+/g, '').trim();

          const boldMatch = trimmed.match(/^\*\*([^*]+)\*\*$/);
          if (boldMatch) {
            const title = boldMatch[1].replace(/\*+/g, '').trim();
            if (title && !this.isMetaKeyword(title) && !title.startsWith('Texto')) {
              return title;
            }
          }
          if (/^[A-ZÀ-Ú0-9\s]{3,40}$/.test(trimmed) && !this.isMetaKeyword(trimmed)) {
            return trimmed;
          }
        }
        return 'Os Inventariantes';
      },

      parseScript(rawText) {
        const lines = (rawText || '').split(/\r?\n/);
        const parsed = [];
        let pendingDirections = [];
        let currentSpeech = null;
        let inDramatisPersonae = false;

        const pushCurrent = () => {
          if (currentSpeech && currentSpeech.segments.length > 0) {
            currentSpeech.spokenText = currentSpeech.segments
              .filter(s => s.type === 'speech')
              .map(s => s.text)
              .join(' ')
              .replace(/\s+/g, ' ')
              .trim();
            if (currentSpeech.spokenText || currentSpeech.segments.length > 0) {
              parsed.push(currentSpeech);
            }
          }
          currentSpeech = null;
        };

        const appendContent = (targetSpeech, content) => {
          if (!content) return;
          const regex = /(\*?\([^\)]+\)\*?|\[[^\]]+\])/g;
          const parts = content.split(regex);
          for (let part of parts) {
            if (!part) continue;
            const isParenRubric = /^\*?\(.*\)\*?$/.test(part.trim());
            const isBracketRubric = /^\[.*\]$/.test(part.trim());
            if (isParenRubric || isBracketRubric) {
              const cleanRubric = part
                .replace(/^\*?[\(\[]\s*/, '')
                .replace(/\s*[\)\]]\*?$/, '')
                .replace(/\*/g, '')
                .trim();
              if (cleanRubric) {
                targetSpeech.segments.push({ type: 'rubric', text: cleanRubric });
              }
            } else {
              const cleanText = part.replace(/\*/g, '').trim();
              if (cleanText) {
                targetSpeech.segments.push({ type: 'speech', text: cleanText });
              }
            }
          }
        };

        for (let rawLine of lines) {
          const line = rawLine.trim();
          if (!line) continue;

          // Dramatis personae block detection (e.g. **Personagens:**)
          if (/^(\*\*|#+\s*)?Personagens:?(\*\*)?$/i.test(line)) {
            inDramatisPersonae = true;
            continue;
          }
          if (inDramatisPersonae) {
            if (/^(\*\*|#+\s*)?(Cenário|Cenario|Ato|Cena):?/i.test(line) ||
                line.startsWith('*(') || line.startsWith('(')) {
              inDramatisPersonae = false;
            } else if (line.startsWith('-') || line.startsWith('•') || line.startsWith('*')) {
              continue;
            }
          }

          // Full-line scene directions
          const isFullParenDir = (line.startsWith('*(') && line.endsWith(')*')) ||
                                 (line.startsWith('(') && line.endsWith(')')) ||
                                 (line.startsWith('[') && line.endsWith(']'));
          if (isFullParenDir) {
            const cleanDir = line.replace(/^\*?[\(\[]\s*/, '').replace(/\s*[\)\]]\*?$/, '').replace(/\*/g, '').trim();
            if (cleanDir) {
              pendingDirections.push(cleanDir);
            }
            continue;
          }

          // Ignore Markdown section headers
          if (/^#+\s+/.test(line)) continue;

          let m = line.match(/^\*\*([^*:]+):\*\*\s*(.*)$/);
          if (!m) m = line.match(/^\*\*([^*:]+)\*\*:\s*(.*)$/);
          if (!m) m = line.match(/^\*\*([^*:]+)\*\*\s*[-—–]\s+(.*)$/);
          if (!m) {
            m = line.match(/^([A-Za-zÀ-ÖØ-öø-ÿ0-9\s_'-]{2,35}):\s*(.*)$/);
            if (m && this.isMetaKeyword(m[1])) m = null;
          }
          if (!m) {
            m = line.match(/^([A-ZÀ-Ú0-9\s]{2,25})\s*[-—–]\s*(.*)$/);
            if (m && this.isMetaKeyword(m[1])) m = null;
          }
          if (!m) {
            const bm = line.match(/^\*\*([^*:\n]{2,35})\*\*$/);
            if (bm) {
              const cand = bm[1].replace(/\*+/g, '').trim();
              if (!this.isMetaKeyword(cand) && !cand.toLowerCase().includes('inventariantes')) {
                m = [line, cand, ''];
              }
            }
          }
          if (!m) {
            const cm = line.match(/^([A-ZÀ-Ú0-9\s]{2,25})$/);
            if (cm) {
              const cand = cm[1].trim();
              if (!this.isMetaKeyword(cand) && !cand.toLowerCase().includes('inventariantes')) {
                m = [line, cand, ''];
              }
            }
          }

          if (m) {
            const whoCandidate = m[1].replace(/\*+/g, '').trim();
            const rawContent = (m[2] || '').trim();

            if (!this.isMetaKeyword(whoCandidate) && !whoCandidate.toLowerCase().includes('inventariantes')) {
              pushCurrent();
              currentSpeech = {
                who: whoCandidate,
                segments: [],
                spokenText: '',
                directions: [...pendingDirections]
              };
              pendingDirections = [];
              if (rawContent) {
                appendContent(currentSpeech, rawContent);
              }
              continue;
            }
          }

          // Continuation lines belonging to active speech
          if (currentSpeech) {
            appendContent(currentSpeech, line);
          }
        }

        pushCurrent();
        return parsed;
      }
    };

    const DramaBeats = {
      generateBeats(speeches, rawText) {
        if (ScriptParser.isDefaultPlay(rawText) && speeches.length === 58) {
          return [...AppConfig.DEFAULT_DRAMA_BEATS];
        }

        const total = speeches.length;
        if (total <= 15) {
          return [{
            name: `Cena Completa (Falas 1-${Math.max(1, total)})`,
            start: 0,
            end: Math.max(0, total - 1)
          }];
        }

        const blockSize = total <= 30 ? 10 : (total <= 60 ? 12 : 15);
        const beats = [];
        let start = 0;
        let beatNum = 1;
        while (start < total) {
          const end = Math.min(total - 1, start + blockSize - 1);
          beats.push({
            name: `Beat ${beatNum}: Falas ${start + 1}-${end + 1}`,
            start,
            end
          });
          start = end + 1;
          beatNum++;
        }
        return beats;
      }
    };

    // 5. STORAGE SERVICE (StorageManager: IndexedDB + LocalStorage)
    const StorageManager = {
      dbInstance: null,

      getIndexedDB() {
        if (this.dbInstance) return Promise.resolve(this.dbInstance);
        if (typeof indexedDB === 'undefined') return Promise.resolve(null);
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('EnsaioTeatralDB', 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('recordings')) {
              db.createObjectStore('recordings', { keyPath: 'id' });
            }
          };
          req.onsuccess = () => {
            this.dbInstance = req.result;
            resolve(this.dbInstance);
          };
          req.onerror = () => reject(req.error);
        });
      },

      getRecordingKey(speechIdx, playId) {
        const pId = playId || AppState.getPlayId();
        return `${pId}_${speechIdx}`;
      },

      async saveCastAudio(speechIdx, blob, playId) {
        const db = await this.getIndexedDB();
        if (!db) return;
        const pId = playId || AppState.getPlayId();
        const key = this.getRecordingKey(speechIdx, pId);
        return new Promise((resolve, reject) => {
          const tx = db.transaction('recordings', 'readwrite');
          tx.objectStore('recordings').put({
            id: key,
            speechIdx,
            playId: pId,
            blob,
            timestamp: Date.now()
          });
          if (pId === 'default') {
            try { tx.objectStore('recordings').put({ id: speechIdx, speechIdx, playId: 'default', blob, timestamp: Date.now() }); } catch (e) {}
          }
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },

      async getCastAudio(speechIdx, playId) {
        const db = await this.getIndexedDB();
        if (!db) return null;
        const pId = playId || AppState.getPlayId();
        const key = this.getRecordingKey(speechIdx, pId);
        return new Promise((resolve, reject) => {
          const tx = db.transaction('recordings', 'readonly');
          const store = tx.objectStore('recordings');
          const req = store.get(key);
          req.onsuccess = () => {
            if (req.result && req.result.blob) {
              resolve(req.result.blob);
            } else if (pId === 'default') {
              const legacyReq = store.get(speechIdx);
              legacyReq.onsuccess = () => resolve(legacyReq.result ? legacyReq.result.blob : null);
              legacyReq.onerror = () => resolve(null);
            } else {
              resolve(null);
            }
          };
          req.onerror = () => reject(req.error);
        });
      },

      async deleteCastAudio(speechIdx, playId) {
        const db = await this.getIndexedDB();
        if (!db) return;
        const pId = playId || AppState.getPlayId();
        const key = this.getRecordingKey(speechIdx, pId);
        return new Promise((resolve, reject) => {
          const tx = db.transaction('recordings', 'readwrite');
          const store = tx.objectStore('recordings');
          store.delete(key);
          if (pId === 'default') {
            try { store.delete(speechIdx); } catch (e) {}
          }
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },

      async clearAllCastAudios() {
        const db = await this.getIndexedDB();
        if (!db) return;
        return new Promise((resolve, reject) => {
          const tx = db.transaction('recordings', 'readwrite');
          tx.objectStore('recordings').clear();
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },

      async getAllRecordings() {
        const db = await this.getIndexedDB();
        if (!db) return [];
        return new Promise((resolve, reject) => {
          const tx = db.transaction('recordings', 'readonly');
          const req = tx.objectStore('recordings').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      },

      getActorProgressKey(actor, playId) {
        const pId = playId || AppState.getPlayId();
        return `memorizador_niveis_${pId}_${Utils.sanitizeId(actor || 'padrao')}`;
      },

      loadProgress(actor, totalSpeeches, playId) {
        const pId = playId || AppState.getPlayId();
        try {
          const saved = JSON.parse(localStorage.getItem(this.getActorProgressKey(actor, pId)));
          if (Array.isArray(saved) && saved.length === totalSpeeches) {
            return saved;
          }
          if (pId === 'default') {
            const leg1 = JSON.parse(localStorage.getItem('memorizador_niveis_' + (actor || 'padrao')));
            if (Array.isArray(leg1) && leg1.length === totalSpeeches) return leg1;
            const leg2 = JSON.parse(localStorage.getItem('inv-' + actor));
            if (Array.isArray(leg2) && leg2.length === totalSpeeches) return leg2;
          }
        } catch (e) {}
        return new Array(totalSpeeches).fill(0);
      },

      saveProgress(actor, masteryLevels, playId) {
        const pId = playId || AppState.getPlayId();
        try {
          localStorage.setItem(this.getActorProgressKey(actor, pId), JSON.stringify(masteryLevels));
          if (pId === 'default') {
            localStorage.setItem('memorizador_niveis_' + (actor || 'padrao'), JSON.stringify(masteryLevels));
          }
        } catch (e) {}
      },

      getActorVoiceKey(actor) {
        return 'voice_actor_' + Utils.sanitizeId(actor || 'padrao');
      },

      getActorVoice(actor) {
        const direct = localStorage.getItem(this.getActorVoiceKey(actor));
        if (direct) return direct;
        const raw = localStorage.getItem('voice_actor_' + (actor || 'padrao'));
        if (raw) return raw;
        if (actor === 'SÉRGIO') return localStorage.getItem('voice_actor_SERGIO');
        if (actor === 'BÁRBARA') return localStorage.getItem('voice_actor_BARBARA');
        return null;
      },

      setActorVoice(actor, voiceName) {
        localStorage.setItem(this.getActorVoiceKey(actor), voiceName);
        localStorage.setItem('voice_actor_' + (actor || 'padrao'), voiceName);
        if (actor === 'SÉRGIO') localStorage.setItem('voice_actor_SERGIO', voiceName);
        if (actor === 'BÁRBARA') localStorage.setItem('voice_actor_BARBARA', voiceName);
      },

      getSpeechIntent(idx, isDefaultPlay, playId) {
        const pId = playId || (isDefaultPlay ? 'default' : AppState.getPlayId());
        const scopedKey = `intent_${pId}_${idx}`;
        const custom = localStorage.getItem(scopedKey);
        if (custom !== null && custom !== undefined) return custom;

        if (pId === 'default') {
          const leg = localStorage.getItem('intent_' + idx);
          if (leg !== null && leg !== undefined) return leg;
          return AppConfig.DEFAULT_INTENTIONS[idx] || '';
        }
        return '';
      },

      setSpeechIntent(idx, val, isDefaultPlay, playId) {
        const pId = playId || (isDefaultPlay ? 'default' : AppState.getPlayId());
        const scopedKey = `intent_${pId}_${idx}`;
        const isReset = val === '__padrao__' || (val && val.toLowerCase() === 'padrao') || (val && val.toLowerCase() === 'padrão');

        if (isReset) {
          localStorage.removeItem(scopedKey);
          if (pId === 'default') localStorage.removeItem('intent_' + idx);
        } else if (val !== undefined && val !== null) {
          localStorage.setItem(scopedKey, val);
          if (pId === 'default') localStorage.setItem('intent_' + idx, val);
        }
      },

      loadSettings() {
        return {
          speechRate: parseFloat(localStorage.getItem('memorizador_rate')) || 0.95,
          partnerVoiceEnabled: localStorage.getItem('memorizador_voice') !== 'false',
          autoAdvanceEnabled: localStorage.getItem('memorizador_autoadvance') === 'true',
          wakeLockEnabled: localStorage.getItem('memorizador_wakelock') !== 'false',
          rehearsalMode: localStorage.getItem('memorizador_mode') || 'cena',
          rehearsalTempo: localStorage.getItem('memorizador_tempo') || 'normal',
          customScript: localStorage.getItem('memorizador_custom_script') || null,
          selectedActor: localStorage.getItem('memorizador_actor') || ''
        };
      },

      saveSettings(state) {
        try {
          localStorage.setItem('memorizador_rate', state.speechRate.toString());
          localStorage.setItem('memorizador_voice', state.partnerVoiceEnabled.toString());
          localStorage.setItem('memorizador_autoadvance', state.autoAdvanceEnabled.toString());
          localStorage.setItem('memorizador_wakelock', state.wakeLockEnabled.toString());
          localStorage.setItem('memorizador_mode', state.rehearsalMode);
          localStorage.setItem('memorizador_tempo', state.rehearsalTempo);
          if (state.selectedActor) {
            localStorage.setItem('memorizador_actor', state.selectedActor);
          }
        } catch (e) {}
      }
    };

    // 6. MOTOR DE ÁUDIO HÍBRIDO (AudioEngine)
    const AudioEngine = {
      availableVoices: [],
      activeUtterance: null,
      activeAudioPlayer: null,
      activeAudioUrl: null,
      autoAdvanceTimer: null,
      mediaRecorder: null,
      audioChunks: [],
      recordingTimer: null,
      recordingSeconds: 0,
      isRecordingNow: false,

      loadVoices(onVoicesLoaded) {
        try {
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            this.availableVoices = window.speechSynthesis.getVoices() || [];
            if (onVoicesLoaded) onVoicesLoaded(this.availableVoices);
          }
        } catch (e) {
          this.availableVoices = [];
        }
      },

      stopAllAudio() {
        if (this.autoAdvanceTimer) {
          clearTimeout(this.autoAdvanceTimer);
          this.autoAdvanceTimer = null;
        }
        if (this.activeAudioPlayer) {
          this.activeAudioPlayer.pause();
          this.activeAudioPlayer = null;
        }
        if (this.activeAudioUrl) {
          try { URL.revokeObjectURL(this.activeAudioUrl); } catch (e) {}
          this.activeAudioUrl = null;
        }
        try {
          if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
        } catch (e) {}
        this.activeUtterance = null;
      },

      getEffectiveTempoRate(baseRate, tempo) {
        if (tempo === 'slow') return 0.80;
        if (tempo === 'fast') return 1.20;
        if (tempo === 'dynamic') {
          return Number((0.82 + Math.random() * 0.36).toFixed(2));
        }
        return baseRate;
      },

      getSupportedMimeType() {
        if (typeof MediaRecorder === 'undefined') return '';
        const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/aac'];
        for (const t of types) {
          if (MediaRecorder.isTypeSupported(t)) return t;
        }
        return '';
      },

      findVoiceForActor(characterName, actorIndex) {
        const savedName = StorageManager.getActorVoice(characterName);
        if (savedName) {
          const match = this.availableVoices.find(v => v.name === savedName);
          if (match) return match;
        }
        const ptVoices = this.availableVoices.filter(v => /^pt/i.test(v.lang));
        const list = ptVoices.length > 0 ? ptVoices : this.availableVoices;
        if (list.length === 0) return null;

        const isFeminine = /a$|bárbara|barbara|nina|arkadina|julieta|mulher|mãe|ofélia|ofelia|gertrudes|senhora|rainha|donzela|menina/i.test(characterName.trim());
        if (isFeminine) {
          const femaleVoices = list.filter(v => /female|feminina|luciana|francisca|maria|vitória|letícia|helena|camila|raquel|fernanda/i.test(v.name));
          if (femaleVoices.length > 0) {
            return femaleVoices[actorIndex % femaleVoices.length];
          }
        }
        const offset = actorIndex >= 0 ? actorIndex % list.length : 0;
        return list[offset] || list[0];
      },

      getPitchForActor(characterName, actorIndex) {
        const isFeminine = /a$|bárbara|barbara|nina|arkadina|julieta|mulher|mãe|ofélia|ofelia|gertrudes|senhora|rainha|donzela|menina/i.test(characterName.trim());
        if (isFeminine) {
          const femPitches = [1.15, 1.25, 1.08, 1.18];
          return femPitches[actorIndex % femPitches.length];
        }
        if (actorIndex === 0) return 0.88;
        if (actorIndex === 1) return 1.08;
        const pitches = [0.90, 1.10, 0.85, 1.15, 1.0];
        return pitches[actorIndex % pitches.length];
      },

      async playSpeechAudio(speechIndex, speech, characterName, actorIndex, baseRate, tempo, callbacks = {}) {
        this.stopAllAudio();
        const effectiveTempo = this.getEffectiveTempoRate(baseRate, tempo);
        if (tempo === 'dynamic' && callbacks.onStatus) {
          callbacks.onStatus(`🎲 Ritmo dinâmico nesta deixa: ${effectiveTempo}x`);
        }

        try {
          const castBlob = await StorageManager.getCastAudio(speechIndex);
          if (castBlob) {
            const audioUrl = URL.createObjectURL(castBlob);
            this.activeAudioUrl = audioUrl;
            const audio = new Audio(audioUrl);
            audio.defaultPlaybackRate = effectiveTempo;
            audio.playbackRate = effectiveTempo;
            audio.onloadedmetadata = () => {
              audio.playbackRate = effectiveTempo;
            };
            this.activeAudioPlayer = audio;
            audio.onended = () => {
              if (this.activeAudioUrl) {
                try { URL.revokeObjectURL(this.activeAudioUrl); } catch (e) {}
                this.activeAudioUrl = null;
              }
              this.activeAudioPlayer = null;
              if (callbacks.onEnd) callbacks.onEnd();
            };
            audio.onerror = () => {
              if (this.activeAudioUrl) {
                try { URL.revokeObjectURL(this.activeAudioUrl); } catch (e) {}
                this.activeAudioUrl = null;
              }
              this.activeAudioPlayer = null;
              this.speakSynthesized(speech.spokenText, characterName, actorIndex, effectiveTempo, callbacks);
            };
            const playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {
                if (callbacks.onStatus) callbacks.onStatus('Toque no botão para ouvir o áudio.');
              });
            }
            if (callbacks.onStatus) callbacks.onStatus(`▶️ Tocando voz real do elenco (${effectiveTempo}x)...`);
            return;
          }
        } catch (e) {}

        this.speakSynthesized(speech.spokenText, characterName, actorIndex, effectiveTempo, callbacks);
      },

      speakSynthesized(text, characterName, actorIndex, rate, callbacks = {}) {
        if (typeof window === 'undefined' || !window.speechSynthesis || !window.SpeechSynthesisUtterance) {
          if (callbacks.onStatus) callbacks.onStatus('Voz indisponível neste navegador.');
          return;
        }

        try {
          this.loadVoices();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';

          const chosenVoice = this.findVoiceForActor(characterName, actorIndex);
          if (chosenVoice) utterance.voice = chosenVoice;

          utterance.pitch = this.getPitchForActor(characterName, actorIndex);
          utterance.rate = rate || 0.95;

          utterance.onstart = () => {
            if (callbacks.onStatus) callbacks.onStatus('');
          };
          utterance.onend = () => {
            this.activeUtterance = null;
            if (callbacks.onEnd) callbacks.onEnd();
          };
          utterance.onerror = (e) => {
            if (e && e.error !== 'canceled' && e.error !== 'interrupted') {
              if (callbacks.onStatus) callbacks.onStatus('Erro no áudio (' + (e.error || 'falha') + ').');
            }
          };

          this.activeUtterance = utterance;
          setTimeout(() => {
            try { window.speechSynthesis.speak(utterance); } catch (e) {}
          }, 50);
        } catch (e) {
          if (callbacks.onStatus) callbacks.onStatus('Erro ao inicializar voz.');
        }
      },

      async startCastRecording(speechIndex, callbacks = {}) {
        try {
          this.stopAllAudio();
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.audioChunks = [];
          const mimeType = this.getSupportedMimeType();
          const options = mimeType ? { mimeType } : {};
          this.mediaRecorder = new MediaRecorder(stream, options);
          this.isRecordingNow = true;

          this.mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) this.audioChunks.push(e.data);
          };

          this.mediaRecorder.onstop = async () => {
            const finalMime = this.mediaRecorder.mimeType || mimeType || 'audio/webm';
            const blob = new Blob(this.audioChunks, { type: finalMime });
            stream.getTracks().forEach(t => t.stop());
            await StorageManager.saveCastAudio(speechIndex, blob);
            this.isRecordingNow = false;
            Utils.triggerHaptic('success');
            if (callbacks.onSaved) callbacks.onSaved();
          };

          this.mediaRecorder.start();
          this.recordingSeconds = 0;
          if (callbacks.onStarted) callbacks.onStarted();

          this.recordingTimer = setInterval(() => {
            this.recordingSeconds++;
            if (callbacks.onTick) callbacks.onTick(this.recordingSeconds);
            if (this.recordingSeconds >= 60) {
              this.stopCastRecording();
            }
          }, 1000);
        } catch (err) {
          alert('Não foi possível acessar o microfone. Verifique as permissões do navegador.');
          this.isRecordingNow = false;
          if (callbacks.onError) callbacks.onError(err);
        }
      },

      stopCastRecording() {
        if (this.recordingTimer) {
          clearInterval(this.recordingTimer);
          this.recordingTimer = null;
        }
        if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
          try { this.mediaRecorder.stop(); } catch(e) {}
        }
        this.isRecordingNow = false;
      }
    };

    // 7. CONTROLADOR DE INTERFACE (UIController)
    const UIController = {

      populateVoiceSelectors() {

      updateHeaderStats() {
        const tabsContainer = Utils.$('characterTabs');
        if (tabsContainer) {
          tabsContainer.innerHTML = AppState.characters.map(c => {
            const isCurrent = c === AppState.selectedActor;
            const total = AppState.speeches.filter(s => s.who === c).length;
            let actorLevels = isCurrent ? AppState.masteryLevels : StorageManager.loadProgress(c, AppState.speeches.length);
            const mastered = AppState.speeches.map((s, i) => s.who === c && (actorLevels[i] || 0) >= 3 ? 1 : 0).reduce((a, b) => a + b, 0);
            return `<button class="char-tab ${isCurrent ? 'active' : ''}" data-actor="${Utils.escapeHtml(c)}">
              ${Utils.escapeHtml(c)} <span class="char-badge">${mastered}/${total}</span>
            </button>`;
          }).join('');
        }

        const myIndices = AppState.getMySpeechIndices();
        const masteredCount = myIndices.filter(i => (AppState.masteryLevels[i] || 0) >= 3).length;
        const pct = myIndices.length > 0 ? Math.round((100 * masteredCount) / myIndices.length) : 0;

        const pBar = Utils.$('progressBar');
        if (pBar) pBar.style.width = pct + '%';
        const mText = Utils.$('masteryText');
        if (mText) mText.textContent = `${masteredCount} de ${myIndices.length} dominadas (${pct}%)`;
        const cText = Utils.$('counterText');
        if (cText) cText.textContent = `Fala ${AppState.currentIndex + 1} de ${AppState.speeches.length}`;
        const nLabel = Utils.$('navCounterLabel');
        if (nLabel) nLabel.textContent = `Fala ${AppState.currentIndex + 1} / ${AppState.speeches.length}`;

        const range = AppState.getActiveBeatRange();
        const btnP = Utils.$('btnPrev');
        const btnN = Utils.$('btnNext');
        if (AppState.rehearsalMode === 'minhas' || AppState.rehearsalMode === 'pingpong' || AppState.rehearsalMode === 'ponto') {
          if (btnP) btnP.disabled = myIndices.length === 0 || AppState.currentIndex <= myIndices[0];
          if (btnN) btnN.disabled = myIndices.length === 0 || AppState.currentIndex >= myIndices[myIndices.length - 1];
        } else {
          if (btnP) btnP.disabled = AppState.currentIndex <= range.start;
          if (btnN) btnN.disabled = AppState.currentIndex >= range.end;
        }
      },

      renderSpeechHtml(speechObj, speechIndex, level, hintsRevealed, isRevealed) {
        if (level === 0 || isRevealed) {
          return speechObj.segments.map(seg => {
            if (seg.type === 'rubric') {
              return ` <span class="rubric">(${Utils.escapeHtml(seg.text)})</span> `;
            }
            return Utils.escapeHtml(seg.text);
          }).join('');
        }

        if (level >= 4 && hintsRevealed === 0) {
          const totalWords = speechObj.spokenText.split(/\s+/).filter(Boolean).length;
          return speechObj.segments.map(seg => {
            if (seg.type === 'rubric') {
              return ` <span class="rubric">(${Utils.escapeHtml(seg.text)})</span> `;
            }
            return '';
          }).join('') + `<div class="full-memory-placeholder">🔒 De memória total (${totalWords} palavras) — diga em voz alta!</div>`;
        }

        let wordCounter = 0;
        let hintGiven = 0;

        return speechObj.segments.map(seg => {
          if (seg.type === 'rubric') {
            return ` <span class="rubric">(${Utils.escapeHtml(seg.text)})</span> `;
          }

          const words = seg.text.split(/(\s+)/);
          return words.map(w => {
            if (/^\s+$/.test(w) || !w) return w;
            const currentWordIdx = wordCounter++;

            const isFunc = Utils.isFunctionWord(w);
            let isHidden = false;
            let mode = 'blank';

            if (level === 1) {
              if (!isFunc) {
                isHidden = Utils.hashCoord(speechIndex, currentWordIdx) < 55;
              }
            } else if (level === 2) {
              if (isFunc) {
                isHidden = Utils.hashCoord(speechIndex, currentWordIdx) < 45;
              } else {
                isHidden = Utils.hashCoord(speechIndex, currentWordIdx) < 85;
              }
            } else if (level === 3) {
              isHidden = true;
              mode = 'initial';
            } else if (level >= 4) {
              isHidden = true;
              mode = 'blank';
            }

            if (isHidden && hintGiven < hintsRevealed) {
              hintGiven++;
              return `<span class="hint-revealed" title="Palavra revelada">${Utils.escapeHtml(w)}</span>`;
            }

            if (isHidden) {
              return Utils.maskWord(w, mode);
            }
            return Utils.escapeHtml(w);
          }).join('');
        }).join('');
      },
